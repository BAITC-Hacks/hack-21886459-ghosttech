[project]
name = "ghosttech-backend"
version = "0.2.0"
description = "GhostTech API for business tasks, teams and proposals"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "openai-agents>=0.8,<1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "pytest>=8,<10", "ruff>=0.11,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
