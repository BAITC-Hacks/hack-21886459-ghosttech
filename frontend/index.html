<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostTech</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">GHOSTTECH / STARTER</p>
    <h1>Всё готово к работе.</h1>
    <p>Python + FastAPI + SQLite. Фронтенд без сборки.</p>
    <p id="status" role="status">Подключаемся к API…</p>
    <section aria-labelledby="notes-title">
      <h2 id="notes-title">Заметки</h2>
      <p>Добавьте заметку — она сохранится в базе после перезапуска.</p>
      <form id="note-form">
        <label for="note-text">Текст заметки</label>
        <div class="form-row">
          <input id="note-text" name="text" maxlength="1000" required placeholder="Первая идея для проекта">
          <button type="submit">Добавить</button>
        </div>
      </form>
      <p id="error" role="alert"></p>
      <ul id="notes"></ul>
    </section>
    <a href="/docs">Документация API ↗</a>
  </main>
</body>
</html>
